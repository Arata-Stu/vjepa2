name: 1mpx

dataset_root: /mnt/ssd-4tb/dataset/gen4
output_root: /media/aten-22/AT_2TB/dataset/1mpx_voxels

splits: [train, test, val]
recursive: false
output_suffix: _voxels.h5
output_subdir: null
overwrite: false

input_height: 720
input_width: 1280
output_height: 720
output_width: 1280
downsample_factor: 2

t_bins: 10
representation: voxel_grid
event_image_percentile: 99.0
save_mp4: false
mp4_fps: null
split_polarity: true
accum_time: 50000
stride_time: null
start_time_us: null

normalize: true
output_dtype: float16
compression_level: 1
use_trilinear: false
writer_capacity_growth: double
rdcc_nbytes: 268435456
rdcc_nslots: 1000003
rdcc_w0: 0.25
tmp_suffix: .tmp
num_processes: 10

activity_mode: full
activity_spatial_patch_size: 16
activity_temporal_patch_size: 2

split_chunk_duration_s: 20
split_output_root: /media/aten-22/AT_2TB/dataset/1mpx_voxels_20s
split_copy_batch_size: 8
split_min_windows_per_chunk: 1
split_chunk_index_pad: 4
split_metadata_mode: full
split_progress_interval_s: 0.0
split_log_chunk_progress: false
split_log_dataset_progress: false
split_delete_source_after_success: true
